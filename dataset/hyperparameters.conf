[DEFAULT]
# Hyperparameters for simple_language_model_shakespeare

epochs=10

# Model
model_type=transformer
n_layer=12
n_head=8
n_embd=768
dropout=0.1

# Data / tokenizer
dataset_path=dataset/input.txt
tokenizer=char
vocab_size=65
block_size=128

# Optimization / training
batch_size=1024
learning_rate=3e-4
weight_decay=0.1
betas=0.9,0.95
grad_clip=1.0
max_iters=200000
lr_decay=true
warmup_iters=500
# Gradient accumulation - can reduce with larger batch
gradient_accumulation_steps=1

# Evaluation & checkpoints
eval_interval=1000
save_interval=5000
out_dir=out

# Misc
seed=1337
device=cuda
# Mixed precision training for faster computation on H100
mixed_precision=true
# Enable cuDNN benchmarking for faster conv/matmul operations
cudnn_benchmark=true