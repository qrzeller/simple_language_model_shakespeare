[DEFAULT]
# Hyperparameters for simple_language_model_shakespeare

epochs=5

# Model
n_layer=8
n_head=8
n_embd=128
dropout=0.1

# Data / tokenizer
dataset_path=dataset/input.txt
vocab_size=65
block_size=64

# Optimization / training
batch_size=64
learning_rate=3e-4
grad_clip=1.0

# Misc
device=mps
seed=1337
weight_sharing=false

# Learning rate scheduler (optional)
# scheduler = none | step | cosine | plateau
# Example: enable cosine decay with linear warmup
scheduler=cosine
# Use per-batch stepping because warmup is defined in steps
scheduler_step_per=batch
# Number of warmup steps (linear increase from 0 -> lr)
scheduler_warmup_steps=500
# Total T_max is computed automatically from epochs*steps_per_epoch when using warmup
# fallback options for pure cosine or step LR
scheduler_T_max=50
scheduler_step_size=10
scheduler_gamma=0.1
scheduler_patience=5